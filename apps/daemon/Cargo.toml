[package]
name = "minimix-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Userspace capture/DSP daemon feeding platform virtual-mic paths"
publish = false

[[bin]]
name = "minimix-daemon"
path = "src/main.rs"

[features]
default = []
win-fake-ring = ["minimix-wavert/win-fake-ring"]

[dependencies]
minimix-engine = { path = "../../crates/engine" }
minimix-wavert = { path = "../../platforms/windows/wave-rt-user" }
minimix-pipewire = { path = "../../platforms/linux/pipewire" }

[target.'cfg(target_os = "macos")'.dependencies]
minimix-audio-io = { path = "../../crates/audio-io" }
minimix-ipc-mac = { path = "../../crates/ipc-mac" }

[lints]
workspace = true
