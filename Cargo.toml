[workspace]
resolver = "2"
members = [
    "crates/dsp",
    "crates/engine",
    "crates/audio-io",
    "crates/config",
    "crates/ui",
    "crates/ipc-mac",
    "apps/monitor",
    "apps/minimix",
    "apps/daemon",
    "platforms/macos/hal-driver",
    "platforms/windows/wave-rt-user",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/edivad1999/minimix"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Abort on panic so a HAL plug-in panic cannot unwind into coreaudiod.
[profile.release]
panic = "abort"
