[package]
name = "minimix-hal-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core Audio AudioServerPlugIn exposing Minimix as a system input"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]
name = "minimix_hal_driver"

# Release builds inherit workspace `panic = "abort"` so process_io cannot
# unwind across the Core Audio C ABI.

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
minimix-ipc-mac = { path = "../../../crates/ipc-mac" }
tympan-aspl = "0.1"
